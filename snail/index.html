<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蜗牛推箱子</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <a class="back" href="../index.html">← 返回主页</a>
        <h1>蜗牛推箱子</h1>
        <p class="hint">用方向键或 WASD 移动，把所有箱子推到圆圈上。</p>

        <div class="bar glass">
            <div id="levels" class="levels"></div>
            <span id="steps">步数 0</span>
            <div class="actions">
                <button id="undoBtn">撤销</button>
                <button id="resetBtn">重来</button>
            </div>
        </div>

        <div class="board-wrap">
            <div id="board" class="board"></div>
            <div id="win" class="win glass" hidden>
                <h2>通关！</h2>
                <p id="winText"></p>
                <button id="nextBtn">下一关</button>
            </div>
        </div>

        <!-- 手机上的方向按钮 -->
        <div class="pad" aria-label="方向键">
            <button data-d="up" aria-label="上">↑</button>
            <button data-d="left" aria-label="左">←</button>
            <button data-d="down" aria-label="下">↓</button>
            <button data-d="right" aria-label="右">→</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
