<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>待办清单</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- 左边：文件夹列表（毛玻璃） -->
        <aside class="sidebar glass">
            <a class="back" href="../index.html">← 返回主页</a>
            <h2>清单</h2>
            <ul id="folderList"></ul>
            <div class="add-folder">
                <input id="folderInput" placeholder="新建文件夹" maxlength="20">
                <button id="folderBtn" aria-label="新建文件夹">+</button>
            </div>
        </aside>

        <!-- 右边：当前文件夹里的待办 -->
        <main class="main">
            <h1 id="title"></h1>
            <p id="count"></p>
            <ul id="todoList"></ul>
            <div class="add-todo glass">
                <input id="todoInput" placeholder="添加待办事项，回车确认" maxlength="100">
                <button id="todoBtn">添加</button>
            </div>
        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
