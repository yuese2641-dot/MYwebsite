<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>专注时钟 · 月色的小站</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><a class="back" href="../index.html">← 返回主页</a><section class="panel glass"><p class="eyebrow">留一点时间给自己</p><h1>专注时钟</h1><p class="sub">选好时长，开始做眼前这一件事。</p><div class="presets"><button data-min="15">15 分钟</button><button class="selected" data-min="25">25 分钟</button><button data-min="45">45 分钟</button><button data-min="60">60 分钟</button></div><div id="clock" class="clock" role="timer">25:00</div><div class="actions"><button id="start" class="primary">开始专注</button><button id="reset">重新开始</button></div><p id="status" class="status" aria-live="polite">准备好了就开始吧</p></section><p class="footnote">不需要一次完成所有事，先专注这一小段。</p></main><script src="script.js"></script></body></html>
